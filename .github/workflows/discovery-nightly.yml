name: Discovery (nightly, pinned)

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Require the org-read token
        env:
          TOKEN: ${{ secrets.DISCOVERY_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::secret DISCOVERY_READ_TOKEN not configured — see ADR-0005 / ADR-0007"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: dependency-explorer

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dependency-explorer/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: dependency-explorer/pnpm-lock.yaml

      - name: Install
        working-directory: dependency-explorer
        run: pnpm install --frozen-lockfile

      - name: Install graphify
        run: pipx install graphifyy==0.9.41

      - name: Clone scanned repos at their production branch
        env:
          TOKEN: ${{ secrets.DISCOVERY_READ_TOKEN }}
        run: |
          cd dependency-explorer
          pnpm --silent --filter @dependency-explorer/discovery repo-list > ../repos.txt
          cd ..
          while read -r repo; do
            case "$repo" in *-tf) branch=main ;; *) branch=master ;; esac
            git clone --quiet --depth 1 --branch "$branch" "https://x-access-token:${TOKEN}@github.com/skelloapp/${repo}.git" "$repo" \
              || echo "::notice::skipped ${repo} (no ${branch} or no access)"
          done < repos.txt

      - name: Pinned discovery
        working-directory: dependency-explorer
        run: |
          set -o pipefail
          pnpm discover -- --pinned --fail-on-new | tee ../discovery-report.md

      - name: Publish report
        if: always()
        run: cat discovery-report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: discovery-report
          path: discovery-report.md
